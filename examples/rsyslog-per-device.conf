# Optional example for an existing rsyslog server. Do not install this if each
# source already has its own file. A dated active name such as
# edge-router-01-20261028-syslog.log is also a valid adopted file; the monitor
# follows the newest day of that name. This snippet does not open a listener. It writes an
# extra copy for every imudp and imtcp message in the default ruleset, not
# only the devices listed in the inventory. Check rule order, disk space,
# SELinux labels, and log rotation before enabling it. An earlier "stop" will
# keep this action from running. Validate with: rsyslogd -N1

template(
  name="SyslogGoMonitorBySourceIP"
  type="string"
  string="/var/log/remote/%fromhost-ip%/syslog.log"
)

if ($inputname == "imudp" or $inputname == "imtcp") then {
  action(
    type="omfile"
    dynaFile="SyslogGoMonitorBySourceIP"
    createDirs="on"
    dirCreateMode="0750"
    fileCreateMode="0640"
  )
}
