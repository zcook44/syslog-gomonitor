# Lab collector only. Per-source files for syslog-gomonitor.
# The firewall address is written to its own path so log_directories has two trees.
module(load="imudp")
module(load="imtcp")
module(load="builtin:omfile")

global(
  workDirectory="/var/lib/rsyslog"
  net.enableDNS="off"
)

template(name="RemoteByIP" type="string" string="/var/log/remote/%fromhost-ip%/syslog.log")

input(type="imudp" port="514" ruleset="remote")
input(type="imtcp" port="514" ruleset="remote")

ruleset(name="remote") {
  if ($fromhost-ip == "10.188.0.30") then {
    action(
      type="omfile"
      file="/var/log/firewall/firewall-01.log"
      createDirs="on"
      fileCreateMode="0644"
      dirCreateMode="0755"
    )
    stop
  }
  action(
    type="omfile"
    dynaFile="RemoteByIP"
    createDirs="on"
    fileCreateMode="0644"
    dirCreateMode="0755"
  )
}
